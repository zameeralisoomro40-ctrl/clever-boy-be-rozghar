<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%" fill="none">
  <!-- Minimalist Official Ad Notice Placeholder -->
  <rect width="800" height="1000" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="40" y="40" width="720" height="920" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1.5"/>
  
  <!-- Header border -->
  <rect x="40" y="40" width="720" height="120" fill="#0A5C36" rx="8 8 0 0"/>
  <circle cx="100" cy="100" r="30" fill="#FFFFFF" fill-opacity="0.15"/>
  <text x="100" y="107" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PK</text>
  
  <text x="150" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">GOVERNMENT OF PAKISTAN</text>
  <text x="150" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#A7F3D0" letter-spacing="1">OFFICIAL RECRUITMENT NOTIFICATION</text>
  
  <!-- Stamp / Seal -->
  <circle cx="680" cy="100" r="32" stroke="#34D399" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="680" y="104" font-family="monospace" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="bold">OFFICIAL AD</text>

  <!-- Body Guidelines Mock -->
  <rect x="80" y="200" width="400" height="24" rx="4" fill="#0F172A"/>
  <rect x="80" y="235" width="640" height="12" rx="3" fill="#E2E8F0"/>
  <rect x="80" y="255" width="580" height="12" rx="3" fill="#E2E8F0"/>
  <rect x="80" y="275" width="610" height="12" rx="3" fill="#E2E8F0"/>

  <!-- Table representation -->
  <rect x="80" y="320" width="640" height="40" fill="#F1F5F9" rx="4"/>
  <text x="100" y="345" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#334155">Sr #</text>
  <text x="160" y="345" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#334155">Name of Post &amp; Scale</text>
  <text x="360" y="345" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#334155">Min. Qualification</text>
  <text x="560" y="345" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#334155">Quota / Domicile</text>

  <!-- Row 1 -->
  <line x1="80" y1="410" x2="720" y2="410" stroke="#E2E8F0"/>
  <rect x="100" y="378" width="30" height="12" rx="2" fill="#CBD5E1"/>
  <rect x="160" y="378" width="160" height="12" rx="2" fill="#0F172A"/>
  <rect x="360" y="378" width="140" height="12" rx="2" fill="#64748B"/>
  <rect x="560" y="378" width="120" height="12" rx="2" fill="#059669"/>

  <!-- Row 2 -->
  <line x1="80" y1="460" x2="720" y2="460" stroke="#E2E8F0"/>
  <rect x="100" y="428" width="30" height="12" rx="2" fill="#CBD5E1"/>
  <rect x="160" y="428" width="180" height="12" rx="2" fill="#0F172A"/>
  <rect x="360" y="428" width="150" height="12" rx="2" fill="#64748B"/>
  <rect x="560" y="428" width="110" height="12" rx="2" fill="#059669"/>

  <!-- Row 3 -->
  <line x1="80" y1="510" x2="720" y2="510" stroke="#E2E8F0"/>
  <rect x="100" y="478" width="30" height="12" rx="2" fill="#CBD5E1"/>
  <rect x="160" y="478" width="140" height="12" rx="2" fill="#0F172A"/>
  <rect x="360" y="478" width="160" height="12" rx="2" fill="#64748B"/>
  <rect x="560" y="478" width="130" height="12" rx="2" fill="#059669"/>

  <!-- General Instructions box -->
  <rect x="80" y="550" width="640" height="260" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="105" y="585" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">GENERAL INSTRUCTIONS &amp; HOW TO APPLY:</text>
  <text x="105" y="618" font-family="system-ui, sans-serif" font-size="12" fill="#475569">1. Candidates are advised to apply online via the official recruitment portal.</text>
  <text x="105" y="642" font-family="system-ui, sans-serif" font-size="12" fill="#475569">2. Incomplete or late submissions will not be entertained under any circumstances.</text>
  <text x="105" y="666" font-family="system-ui, sans-serif" font-size="12" fill="#475569">3. Domicile quota: Merit, Punjab, Sindh (U/R), KPK, Balochistan, GB, and AJK.</text>
  <text x="105" y="690" font-family="system-ui, sans-serif" font-size="12" fill="#475569">4. Five (5) years general age relaxation admissible as per Federal Government rules.</text>
  <text x="105" y="714" font-family="system-ui, sans-serif" font-size="12" fill="#475569">5. No TA/DA will be admissible for appearing in test / interview.</text>
  <text x="105" y="745" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#DC2626">DEADLINE: Apply before closing date specified on the portal.</text>

  <!-- Footer Seal -->
  <rect x="520" y="850" width="200" height="60" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-dasharray="3 3"/>
  <text x="620" y="875" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">SECRETARY / DIRECTOR HR</text>
  <text x="620" y="895" font-family="system-ui, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Recruitment Division, Pakistan</text>
</svg>
